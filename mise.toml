# 도구 버전 고정(로컬과 CI가 같은 파일을 쓴다: CI는 jdx/mise-action). 전역 mise 설정의 minimum_release_age=7d 정책을 따른다.
# 호환성 때문에 고른 버전은 근거 URL과 확인일을 주석으로 남긴다.
[tools]
gitleaks = "8.30.1"
lefthook = "2.2.2"
# Android 빌드 JDK. AGP 9.3은 JDK 17 이상을 요구한다: https://developer.android.com/build/releases/agp-9-3-0-release-notes (확인일 2026-11-21)
java = "temurin-21.0.9+10.0.LTS"
# Kotlin 포매터·린터. 2025-11-14 게시.
ktlint = "1.8.0"
# 로컬 Supabase(Auth + Postgres) 실행. 2026-11-09 게시. 3.2.0(2026-11-16)은 7일이 지나지 않았다.
# CLI v3은 기본 대상이 로컬이다: https://supabase.com/changelog/supabase-cli-v3 (확인일 2026-11-21)
supabase = "3.1.0"
# 스택 도구(node, pnpm 등)를 정확한 버전으로 추가한다.

# OP_ACCOUNT는 mise.local.toml(gitignore)에 둔다. 예시는 mise.local.toml.example.

[env]
# Supabase CLI 사용 통계를 이 저장소의 명령에서 보내지 않는다(전역 설정은 건드리지 않는다).
SUPABASE_TELEMETRY_DISABLED = "1"

[tasks.setup]
description = "최초 도구·훅 설치 (비밀값 불필요)"
run = ["mise install", "lefthook install"]

[tasks.doctor]
description = "개발 환경 점검: 도구 설치, 비밀값 보호 장치, 1Password 계정"
run = "bash scripts/doctor.sh"

[tasks."hooks:install"]
description = "gitleaks pre-commit 훅 설치(lefthook). 클론한 뒤 한 번 실행한다"
run = "lefthook install"

# 모바일 앱(apps/). Android SDK 위치는 ANDROID_HOME 또는 apps/android/local.properties(gitignore)로 정한다.
[tasks."android:lint"]
description = "Kotlin 포맷 검사(ktlint)와 Android lint(debug, release)"
dir = "apps/android"
run = ["ktlint '**/*.kt' '**/*.kts'", "./gradlew :app:lintDebug :app:lintRelease"]

[tasks."android:test"]
description = "Android JVM 단위 테스트"
dir = "apps/android"
run = "./gradlew :app:testDebugUnitTest"

[tasks."android:build"]
description = "Android debug·release APK 빌드(release는 서명하지 않음)"
dir = "apps/android"
run = "./gradlew :app:assembleDebug :app:assembleRelease"

[tasks."android:e2e"]
description = "에뮬레이터 E2E(테스트 구현체). 실행 중인 에뮬레이터 하나가 필요하다. 인자: [증거 폴더]"
dir = "apps/android"
run = "./gradlew :app:assembleDebug -Pnonanona.backend=test && python3 -I scripts/e2e.py app/build/outputs/apk/debug/app-debug.apk"

[tasks."android:e2e-local"]
description = "에뮬레이터 E2E(로컬 Supabase 모드). local:up 뒤 실행한다. 초기화 → 로컬 모드 debug 빌드 → 실제 서버 흐름. 인자: [증거 폴더]"
dir = "apps/android"
run = "python3 -I ../../scripts/local-backend.py reset && ./gradlew :app:assembleDebug && python3 -I scripts/e2e_local.py app/build/outputs/apk/debug/app-debug.apk"

[tasks."android:e2e-receipts"]
description = "에뮬레이터 E2E(영수증 처리): 가상 영수증 10장 공유 → ML Kit OCR → 처리 중 SIGKILL → 이어서 처리 → 실패만 다시 읽기 → 가림 사본 검사. 인자: [증거 폴더]"
dir = "apps/android"
run = "./gradlew :app:assembleDebug -Pnonanona.backend=test && python3 -I scripts/e2e_receipts.py app/build/outputs/apk/debug/app-debug.apk"

[tasks."android:e2e-upload"]
description = "에뮬레이터 E2E(로컬 Supabase 모드, 영수증 올리기). local:up 뒤 실행한다. 초기화 → 로컬 모드 debug 빌드 → E2E. 인자: [증거 폴더]"
dir = "apps/android"
run = "python3 -I ../../scripts/local-backend.py reset && ./gradlew :app:assembleDebug && python3 -I scripts/e2e_upload.py app/build/outputs/apk/debug/app-debug.apk"

[tasks."android:e2e-review"]
description = "접히는 기기 에뮬레이터 E2E(목록 먼저 영수증 검토, 로컬 Supabase 모드). local:up 뒤, 접은 채 실행 중인 접히는 기기 에뮬레이터 하나에서 실행한다. iOS ios:e2e-review와 같은 순서 + 펴기(두 칸)·접기. 인자: [증거 폴더]"
dir = "apps/android"
run = "python3 -I ../../scripts/local-backend.py reset && ./gradlew :app:assembleDebug && python3 -I scripts/e2e_review.py app/build/outputs/apk/debug/app-debug.apk"

[tasks."android:e2e-adaptive"]
description = "접히는 기기 에뮬레이터 E2E(적응형 화면, 테스트 구현체): 펼침 두 칸 → 읽는 중 접기·펴기·반쯤 접기 → 중복 OCR 없음 → 시트·확인 창이 접힘을 피함 → 확인 창이 접기 뒤에도 남고 한 번만 올림 → 가로+큰 글자·낮은 창. 실행 중인 접히는 기기 에뮬레이터 하나(예: Pixel 9 Pro Fold 프로필). 인자: [증거 폴더]"
dir = "apps/android"
run = "./gradlew :app:assembleDebug -Pnonanona.backend=test && python3 -I scripts/e2e_adaptive.py app/build/outputs/apk/debug/app-debug.apk"

[tasks."ios:lint"]
description = "swift-format 검사(고정한 Xcode에 포함된 버전)"
dir = "apps/ios"
run = "xcrun swift-format lint --strict --recursive --parallel Nonanona NonanonaShare NonanonaTests NonanonaUITests Packages/ReceiptImport"

[tasks."ios:test"]
description = "가져오기 패키지 테스트(macOS)와 앱 단위 테스트(시뮬레이터). IOS_DESTINATION으로 시뮬레이터를 바꾼다"
dir = "apps/ios"
run = [
  "swift test --package-path Packages/ReceiptImport",
  "xcodebuild test -quiet -project Nonanona.xcodeproj -scheme Nonanona -only-testing:NonanonaTests -destination \"${IOS_DESTINATION:-platform=iOS Simulator,name=iPhone 18 Pro}\"",
]

[tasks."ios:build"]
description = "iOS 앱·공유 확장 debug·release 빌드(시뮬레이터)"
dir = "apps/ios"
run = [
  "xcodebuild build -quiet -project Nonanona.xcodeproj -scheme Nonanona -configuration Debug -destination 'generic/platform=iOS Simulator'",
  "xcodebuild build -quiet -project Nonanona.xcodeproj -scheme Nonanona -configuration Release -destination 'generic/platform=iOS Simulator'",
]

[tasks."ios:release-check"]
description = "release 빌드에 테스트 로그인이 없고 로그인할 수 없는 상태로 보이는지 시뮬레이터에서 확인"
dir = "apps/ios"
run = "xcodebuild test -quiet -project Nonanona.xcodeproj -scheme NonanonaReleaseCheck -destination \"${IOS_DESTINATION:-platform=iOS Simulator,name=iPhone 18 Pro}\""

[tasks."ios:e2e"]
description = "시뮬레이터 E2E(테스트 구현체). 인자: <시뮬레이터 UDID> [증거 폴더]"
dir = "apps/ios"
run = "scripts/e2e.sh"

[tasks."ios:e2e-receipts"]
description = "시뮬레이터 E2E(영수증 처리): 가상 영수증 10장 공유 → Vision OCR → 처리 중 SIGKILL → 이어서 처리 → 실패만 다시 읽기 → 가림 사본 검사. 인자: <시뮬레이터 UDID> [증거 폴더]"
dir = "apps/ios"
run = "scripts/e2e-receipts.sh"

[tasks."ios:e2e-adaptive"]
description = "시뮬레이터 E2E(적응형 화면, 테스트 구현체): 읽는 중 회전 → 같은 초안·처리 상태, 중복 OCR 없음 → 최종 확인 창이 회전 뒤에도 남고 한 번만 올림 → 큰 글자+가로. 가로가 regular 폭인 기기는 EXPECT_WIDE_LANDSCAPE=1. 인자: <시뮬레이터 UDID> [증거 폴더]"
dir = "apps/ios"
run = "scripts/e2e-adaptive.sh"

[tasks."ios:e2e-posture"]
description = "iPhone Duo 시뮬레이터 E2E(자세 변경, 테스트 구현체): 읽는 중 folded → book → flat → folded에서 같은 초안·처리 상태, 중복 OCR 없음 → 최종 확인 창이 자세 변경 뒤에도 남고 한 번만 올림 → book에서 division 밖. Device Hub 자세 버튼을 Orca Computer Use로 누른다(앞으로 가져옴). 새 Duo 시뮬레이터를 Device Hub에 접은 채 띄우고 실행. 인자: <시뮬레이터 UDID> [증거 폴더]"
dir = "apps/ios"
run = "scripts/e2e-posture.sh"

[tasks."ios:e2e-upload"]
description = "시뮬레이터 E2E(로컬 Supabase 모드, 영수증 올리기). local:up 뒤 실행한다. 인자: <시뮬레이터 UDID> [증거 폴더]"
dir = "apps/ios"
run = "scripts/e2e-upload.sh"

[tasks."ios:e2e-review"]
description = "시뮬레이터 E2E(목록 먼저 영수증 검토, 로컬 Supabase 모드). local:up 뒤 새 시뮬레이터에서 실행한다: 10장 대기열 → 실패만 다시 읽기 → 직접 입력 → 값 고치기 → 놓친 가림 고치기·미리보기 → 입력 중 SIGKILL 뒤 이어서 → 회전·큰 글자 → 올릴 곳 없음·구성원 아님·최종 확인 전 0건 → 올리기·반복 수렴 → 서버 사본·필드 검사. 가로가 regular인 기기는 EXPECT_WIDE_LANDSCAPE=1. 인자: <시뮬레이터 UDID> [증거 폴더]"
dir = "apps/ios"
run = "scripts/e2e-review.sh"

[tasks."ios:e2e-local"]
description = "시뮬레이터 E2E(로컬 Supabase 모드). local:up 뒤 실행한다. 인자: <시뮬레이터 UDID> [증거 폴더]"
dir = "apps/ios"
run = "scripts/e2e-local.sh"

[tasks."local:up"]
description = "로컬 Supabase(Docker) 시작 → 가상 계정·초대 → 앱 로컬 모드 설정 파일(gitignore). 키는 출력하지 않는다"
run = "python3 -I scripts/local-backend.py up"

[tasks."local:reset"]
description = "로컬 DB를 초기 상태(가상 계정·여행방·초대)로 되돌리고 앱 설정 파일을 새로 쓴다"
run = "python3 -I scripts/local-backend.py reset"

[tasks."local:contract"]
description = "정산 서버 계약 시험(실제 HTTP: 권한·재시도·동시성·오래된 버전·확정 불변). local:up 또는 local:reset 뒤. 실행마다 새 가상 여행방을 만든다. 인자: [결과 JSON]"
run = "python3 -I scripts/settlement-contract.py"

[tasks."local:fx-contract"]
description = "엔화 원화 기준 계약 시험(실제 HTTP: ECOS 응답 원문 검사·as-of·고시값 갱신 충돌·승인·확정 고정·재현·권한). local:up 또는 local:reset 뒤. 가상 시험값만 쓴다. 인자: [결과 JSON]"
run = "python3 -I scripts/fx-contract.py"

[tasks."local:fx-upgrade"]
description = "엔화 원화 기준 마이그레이션 업그레이드 검사: 앞 마이그레이션까지 되돌려 v1 확정본·검토 요청을 만든 뒤 새 마이그레이션을 올려 그대로인지 본다. 로컬 DB를 지우고 끝나면 local:reset 상태로 되돌린다. 인자: [결과 JSON]"
run = "python3 -I scripts/fx-upgrade-check.py"

[tasks."local:fx-correction-contract"]
description = "확정 전 기준환율 정정 계약 시험(ADR-0009, 실제 HTTP: 정정 시 확정 차단·고정 금액 유지·새 예상 적용·반복 정정·같은 값 다시 받기·고시값 사라짐·출처 종류·받기와 확정·유지의 동시성·재시도·권한). local:up 또는 local:reset 뒤. 인자: [결과 JSON]"
run = "python3 -I scripts/fx-correction-contract.py"

[tasks."local:fx-correction-upgrade"]
description = "정정 정책 마이그레이션 업그레이드 검사: 앞 마이그레이션까지 되돌려 v2 확정본·확정·검토 요청·정정된 포함 예상액을 만든 뒤 새 마이그레이션을 올려 본다. 로컬 DB를 지우고 끝나면 local:reset 상태로 되돌린다. 인자: [결과 JSON]"
run = "python3 -I scripts/fx-correction-upgrade-check.py"

[tasks."local:share-proposal-contract"]
description = "품목 나누기 제안 몫 계약 시험(ADR-0011, 실제 HTTP: 올린 사람만·정확한 몫·원화 기준 묶기·고시값 정정·재시도·잠금 경쟁·보이는 사람·확정에 닿지 않음). local:up 또는 local:reset 뒤. 인자: [결과 JSON]"
run = "python3 -I scripts/share-proposal-contract.py"

[tasks."fx:fixture"]
description = "기준환율 가상 시험값(시장 환율 아님, data_origin=fixture)을 로컬 DB에 넣는다. local:reset이 이미 넣는다"
run = "python3 -I scripts/ecos-fx.py fixture"

[tasks."fx:series"]
description = "ECOS 731Y001/0000002(원/일본엔 100엔) 메타데이터 확인. ECOS_API_KEY 필요: op run --env-file=.env.tpl -- mise run fx:series"
run = "python3 -I scripts/ecos-fx.py series"

[tasks."fx:ingest"]
description = "ECOS에서 원/일본엔(100엔) 일별 고시값을 받아 로컬 서버에 넣는다(data_origin=ecos_live). ECOS_API_KEY 필요(op run). 인자: <시작 YYYY-MM-DD> [<끝 YYYY-MM-DD>]"
run = "python3 -I scripts/ecos-fx.py ingest"

[tasks."e2e:settlement"]
description = "두 기기 정산 E2E(로컬 Supabase 모드): 부팅한 iOS 시뮬레이터 하나 + 실행 중인 Android 에뮬레이터 하나. 한쪽이 가상 방장, 다른 쪽이 가상 회원으로 올리기·직접 입력 → 검토·보류 → 미리보기 → 오래된 revision 확정 거절 → 확정 → 다시 열어도 같은 확정본. local:up 뒤. 인자: <시뮬레이터 UDID> <방장 기기 ios|android> [증거 폴더]"
run = "python3 -I scripts/e2e-settlement.py"

[tasks."e2e:items"]
description = "품목별 나누기 E2E(로컬 Supabase 모드, 방장 기기 하나, ADR-0010): 가상 품목 영수증 2장 공유·확인·올리기 → 실제 기기 번역 상태 기록 → 미리보기 대역 번역(첫 실패 뒤 다시) → 공유·한 사람 품목, 나눠떨어지지 않는 1원은 방장이 직접 → 외세·할인은 조정 줄로 정확히 → 앱 종료 뒤 계획 유지 → 서버 몫 확인, 서버 DB 전체에 품목 글자 없음. local:up 뒤. 인자: ios <시뮬레이터 UDID> [증거 폴더] | android [증거 폴더]"
run = "python3 -I scripts/e2e-items.py"

[tasks."e2e:proposals"]
description = "두 기기 품목 나누기 제안 E2E(ADR-0011, 로컬 Supabase 모드): 올린 회원이 품목 계획으로 몫을 계산해 남은 원을 직접 고르고 동의해 제안 → 방장이 제안·입력 몫을 보고 채운 뒤 포함 → 기준환율 정정 뒤 stale·다시 보내기 → 확정. 오간 REST/RPC 본문과 서버 DB 전체에 품목 글자 없음. 새 가상 여행방을 만든다(DB를 지우지 않는다). local:up 뒤. 인자: <시뮬레이터 UDID> <올린 회원 기기 ios|android> [증거 폴더]. Android 기기가 여럿이면 ANDROID_SERIAL"
run = "python3 -I scripts/e2e-proposals.py"

[tasks."local:down"]
description = "로컬 Supabase 정지, 앱 설정 파일 삭제(debug 앱은 테스트 모드로 돌아간다)"
run = "python3 -I scripts/local-backend.py down"

[tasks.lint]
description = "두 앱의 린트"
depends = ["ios:lint", "android:lint"]

[tasks.test]
description = "두 앱의 단위 테스트"
depends = ["ios:test", "android:test"]

[tasks."secrets:scan"]
description = "gitleaks로 작업 트리와 git 히스토리 전체를 스캔"
run = [
  "gitleaks dir . --config .gitleaks.toml --redact --no-banner",
  "gitleaks git . --config .gitleaks.toml --redact --no-banner",
]

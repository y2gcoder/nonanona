# gitleaks로 저장소 전체를 검사한다. 설정은 로컬 pre-commit 훅과 같은 .gitleaks.toml.
name: secrets-scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'   # 매주 월요일: 규칙이 갱신된 뒤 과거 히스토리를 다시 검사

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # 히스토리 전체를 스캔
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: --locked gitleaks # mise.lock의 URL과 체크섬으로 설치한다.
          minimum_release_age: 7d # mise 실행 파일 릴리스 선택에 적용된다.
      - name: 히스토리 스캔
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner
      - name: 작업 트리 스캔
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner
